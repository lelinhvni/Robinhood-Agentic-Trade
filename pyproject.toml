[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-trade"
version = "0.1.0"
description = "Claude-driven paper-trading agent for Robinhood crypto"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.9",
    "requests>=2.31",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentic-trade = "agentic_trade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
